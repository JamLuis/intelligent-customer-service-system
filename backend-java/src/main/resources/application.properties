server.port=${BACKEND_PORT:8088}
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8100}
mcp.server.base-url=${MCP_SERVER_BASE_URL:http://localhost:3202}
spring.application.name=smart-support-backend-java
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_support}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smart_support}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smart_support}
spring.datasource.driver-class-name=org.postgresql.Driver
smart-support.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
smart-support.neo4j.username=${NEO4J_USER:neo4j}
smart-support.neo4j.password=${NEO4J_PASSWORD:smart_support}
smart-support.neo4j.database=${NEO4J_DATABASE:neo4j}
