server:
  port: 8088

spring:
  application:
    name: smart-support-backend-java
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_support}
    username: ${SPRING_DATASOURCE_USERNAME:smart_support}
    password: ${SPRING_DATASOURCE_PASSWORD:smart_support}
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info

smart-support:
  ai-service-base-url: ${AI_SERVICE_BASE_URL:http://localhost:8100}
  mcp-server-base-url: ${MCP_SERVER_BASE_URL:http://localhost:3202}